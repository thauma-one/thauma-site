# Keep `dev` up to date with `main`
#
# WHY
# -----------------------------------------------------------------------------
# The content editor commits to `main`. Code is written on `dev`. Without this,
# `dev` falls further behind every time somebody edits a word on the website,
# and the next code merge arrives carrying a pile of content changes it has to
# reconcile — or worse, quietly reverts them.
#
# A system where one surface can write somewhere another surface cannot read is
# broken. This is the other half of that: GitHub keeps `dev` current, and the
# Pi's own sync (deploy/git-sync.sh) pulls `dev`.
#
# ⚠ WHY THIS IS SCHEDULED AND NOT ONLY push-TRIGGERED
# -----------------------------------------------------------------------------
# Content saves carry `[skip ci]` in the commit message, which is what stops
# them deploying — and GitHub applies that to EVERY workflow for that push,
# including this one. So a push trigger alone would run for code merges and
# never for the exact case this exists to handle.
#
# The schedule is therefore the primary path and the push trigger is the bonus.
# Ten minutes is the worst case for a content edit reaching the Pi; pushes of
# code reach it immediately.
name: Sync dev with main

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          # The whole history: a merge needs the commits on both sides, and the
          # default shallow clone has neither.
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          set -euo pipefail
          git config user.name  "Thauma sync"
          git config user.email "admin@thauma.one"

          git fetch origin main:refs/remotes/origin/main

          if git merge-base --is-ancestor origin/main dev; then
            echo "dev already contains main — nothing to do."
            exit 0
          fi

          # WORD FILES MERGE ENTRY BY ENTRY (.gitattributes, deploy/json-merge.mjs,
          # 2026-09-30). A staff member's edit on main and a key added on dev
          # sit on neighboring lines and used to conflict here, stopping this
          # sync until a person came. As entries they never disagreed. The
          # same entry changed on both sides keeps the NEWER value — the
          # driver walks each side's history to see when it was set — and the
          # older value is written into the merge commit, not dropped quietly.
          git config merge.jsonentries.driver "node deploy/json-merge.mjs %O %A %B %P"
          rm -f .git/thauma-merge-report

          # --no-edit so an unattended merge does not sit waiting for an editor.
          # Anything else that conflicts still fails the job and NOTHING is
          # pushed: the branches stay as they were and a person sorts it out,
          # and the Publish page says so (admin-publish.js, the sync's last run).
          if ! THAUMA_MERGE_OURS=HEAD THAUMA_MERGE_THEIRS=origin/main \
               git merge origin/main --no-edit -m "Bring content edits from main into dev"; then
            echo "::error::main and dev have conflicting changes. Merge them by hand."
            git diff --name-only --diff-filter=U | sed 's/^/::error::  conflict in /' || true
            git merge --abort || true
            exit 1
          fi
          if [ -s .git/thauma-merge-report ]; then
            echo "::warning::Entries changed on both sides; kept the newer:"
            cat .git/thauma-merge-report
            git commit --amend -m "Bring content edits from main into dev

          Entries changed on both sides; the newer value was kept:
          $(cat .git/thauma-merge-report)"
          fi

          git push origin dev
          echo "dev updated from main."
