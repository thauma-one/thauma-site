# Deploy next.thauma.one
#
# WHY THIS EXISTS
#
# `dev` had no deploy at all. next.thauma.one was updated by somebody running
# `wrangler deploy` on a Raspberry Pi, which was survivable while staging was
# only ever looked at by the person who had just deployed it.
#
# It stopped being survivable when the content editor shipped. Editing copy on
# staging commits to `dev` — and with nothing watching `dev`, the staging site
# never rebuilt, so you could not see your own edit. "Edit on dev, review it,
# then move it live" was a workflow with no review step in it.
#
# So: push to `dev` -> staging rebuilds -> look at it -> publish from /admin/.
#
# THE SAME BUILD AND THE SAME TESTS AS PRODUCTION, deliberately. A staging
# deploy that skipped the checks would be a staging deploy that could pass
# while production failed, which is the one thing staging must never do. The
# only differences are the output directory and the wrangler environment.
name: Deploy staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the Pi and the production workflow. wrangler is pinned
      # to exactly 4.86.0 — 4.123+ needs Node 22. See docs/SPEC.md §8.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # _site_next, which is what [assets] points at in the top-level config.
      # NOT _site — that is the local dev server's ungated watch output, and
      # pointing a deploy at it once would have published every unreleased page.
      - name: Build
        run: npx @11ty/eleventy --output=_site_next

      - name: Test
        run: |
          python3 db/test_schema.py
          cd workers && npm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57c887d9191048d984a7607c9e9334b7
        # No --env: the top-level config IS staging. Production has to be named
        # out loud, which is why the dangerous one is the one that needs a flag.
        run: npx wrangler deploy

      # Staging carries the dev database and the same Access gate, so the codes
      # that would reveal a problem are the same ones production checks.
      - name: Verify staging
        run: |
          sleep 5
          fail=0
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1")
            if [ "$got" = "$2" ]; then
              echo "ok   $1 -> $got"
            else
              echo "::error::$1 returned $got, expected $2"
              fail=1
            fi
          }
          check https://next.thauma.one/en/ 200
          check https://next.thauma.one/ 302
          check https://next.thauma.one/staff/ 302
          check https://next.thauma.one/api/staff-snapshot 401
          check https://next.thauma.one/api/admin/publish 401
          exit $fail
