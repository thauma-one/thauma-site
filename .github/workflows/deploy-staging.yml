      # ---- END TEST STEPS ----

      # CHECK, DON'T APPLY. Staging shares live's database since 2026-09-29
      # (wrangler.toml, ONE DATABASE), so a migration here is a migration to
      # the real records — a person does that on purpose from Admin › Publish
      # › Migrations, never a Preview as a side effect. This refuses the deploy
      # while one is pending, exactly as production's does.
      #
      # Before the deploy, not after: a Worker that goes live against a schema
      # it does not match returns 500s from whichever screen touches the new
      # tables, and the deploy that caused it reports success.
      - name: Check the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57c887d9191048d984a7607c9e9334b7
        run: node deploy/migration-state.mjs --database thauma-ops

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57c887d9191048d984a7607c9e9334b7
        # No --env: the top-level config IS staging. Production has to be named
        # out loud, which is why the dangerous one is the one that needs a flag.
        run: npx wrangler deploy

      # Staging carries the dev database and the same Access gate, so the codes
      # that would reveal a problem are the same ones production checks.
      - name: Verify staging
        run: |
          fail=0
          # RETRIED, NOT SLEPT AT.
          #
          # A Worker deploy is not visible from everywhere the instant the API
          # returns, and a flat `sleep 5` was sometimes short by a second or
          # two. On 2026-08-20 a staging deploy that had genuinely WORKED
          # reported failure — /api/admin/publish answered 404 during the
          # check and 401 a moment later, from the asset layer serving the
          # 404 page before the route existed.
          #
          # A false failure here is worse than a slow check, because the
          # Publish page decides what is live by asking which run last
          # SUCCEEDED. So a deploy that worked but was checked too early
          # leaves the console saying nothing has been previewed, and the
          # person pressing the button has no way to tell the difference.
          check() {
            url="$1"; want="$2"; got=""
            for i in $(seq 1 20); do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              if [ "$got" = "$want" ]; then
                echo "ok   $url -> $got (attempt $i)"
                return
              fi
              sleep 5
            done
            echo "::error::$url returned $got, expected $want — still wrong after 100s"
            fail=1
          }
          check https://next.thauma.one/en/ 200
          check https://next.thauma.one/ 302
          check https://next.thauma.one/staff/ 302
          check https://next.thauma.one/api/staff-snapshot 401
          check https://next.thauma.one/api/admin/publish 401
          exit $fail
