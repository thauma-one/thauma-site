# Deploy next.thauma.one
#
# WHY THIS EXISTS
#
# This is the PREVIEW. The Preview button in /admin/publish/ dispatches it
# against `main`, so next.thauma.one shows exactly what pressing Publish would
# send to the live site — words included, since content saves commit to `main`
# and simply do not deploy.
#
# ⚠ DISPATCH ONLY. There is deliberately no push trigger.
#
# It had one, on `dev`, back when content was edited there. Leaving it would
# now break the one promise this workflow makes: `sync-dev.yml` pushes to `dev`
# every time content changes, so staging would rebuild from `dev` behind
# somebody's back and "Preview" would quietly start meaning "whatever was
# pushed most recently". A preview that is not what you would publish is worse
# than no preview, because it gets believed.
#
# To try code out on staging before merging it, dispatch this manually with
# ref `dev` — an explicit act, which is the point.
#
# THE SAME BUILD AND THE SAME TESTS AS PRODUCTION, deliberately. A staging
# deploy that skipped the checks could pass while production failed, which is
# the one thing staging must never do. The only differences are the output
# directory and the wrangler environment.
name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the Pi and the production workflow. wrangler is pinned
      # to exactly 4.86.0 — 4.123+ needs Node 22. See docs/SPEC.md §8.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # _site_next, which is what [assets] points at in the top-level config.
      # NOT _site — that is the local dev server's ungated watch output, and
      # pointing a deploy at it once would have published every unreleased page.
      - name: Build
        run: npx @11ty/eleventy --output=_site_next

      # One step per test file, so the Publish bar can count them as they
      # pass; see deploy/test-steps.mjs.
