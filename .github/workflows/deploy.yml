# Deploy thauma.one
#
# THE PUBLISH BUTTON IS THE ONLY THING THAT DEPLOYS. Not a push, not a merge —
# the button on /admin/publish/, which asks for the word PUBLISH to be typed.
#
# This used to run on every push to main, and that turned out to be the wrong
# shape for this project. It meant merging code was itself an act of
# publishing, so a branch could not be brought up to date without also putting
# it in front of the public — and the person who owns the decision to publish
# had to schedule it around somebody else's merge. Changed 2026-08-18, after
# that coupling had confused things one time too many.
#
# Now the two are independent:
#
#   merging to main   puts the code where the site is BUILT FROM. Nothing
#                     visible happens. Safe at any hour, by anyone.
#   saving content    commits words to main, with [skip ci]. Also invisible.
#   pressing Publish  builds main and deploys it. The site changes here, and
#                     only here.
#
# The Publish page already lists everything waiting, so "nothing deployed on
# its own" is a promise it can keep rather than a race it has to survive.
#
# Replaces Netlify's build-on-push, which stopped applying when hosting moved
# to Cloudflare Workers on 2026-08-15.
name: Deploy production

on:
  # workflow_dispatch ONLY. See above — a push trigger here would make merging
  # and publishing the same act again, which is the thing this removed.
  workflow_dispatch:

# One deploy at a time. Two people pressing Publish within a minute of each
# other would otherwise race, and the loser could finish LAST and overwrite
# the newer build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the Raspberry Pi, where every local deploy has been
      # tested. wrangler is pinned to exactly 4.86.0 because 4.123+ requires
      # Node 22 — see the note in docs/SPEC.md. Keeping CI and local on the
      # same runtime means a deploy that works in one works in the other.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The GATED production build, into its own directory.
      #
      # _site is the dev server's watch output and is the UNGATED site; the
      # config used to point production at it, which would have published every
      # unreleased page. Building to _site_prod here keeps CI and the local
      # script doing literally the same thing.
      - name: Build
        run: npx @11ty/eleventy --output=_site_prod

      # Assert the build matches what site.json actually asked for.
      #
      # comingSoon true  -> interior pages MUST be absent
      # comingSoon false -> interior pages MUST be present
      #
      # Both directions, because the dangerous failure is asymmetric: shipping
      # a gated build after launch is an outage somebody notices in minutes,
      # while shipping an ungated build before launch publishes unfinished work
      # and cannot be taken back once it is crawled.
      - name: Verify the build matches the comingSoon setting
        run: |
          # Defaults to "true" if the visibility block is absent, matching
          # src/_data/visible.js. Reading the path directly would throw on a
          # site.json predating the block — a crash instead of a verdict, at
          # the one step whose job is to give a verdict.
          coming=$(node -p "
            const s=require('./src/_data/site.json');
            const c=(s.visibility||{}).comingSoon;
            c===undefined ? 'true' : (typeof c==='boolean' ? String(c) : String(c.live!==false));
          ")
          pages=$(find _site_prod -name '*.html' | wc -l)
          echo "comingSoon=$coming, $pages pages built"
          if [ "$coming" = "true" ]; then
            if [ -f _site_prod/en/about/index.html ]; then
              echo "::error::comingSoon is true but interior pages were built — this would publish unreleased content."
              exit 1
            fi
            echo "Gated build confirmed: interior pages absent."
          else
            if [ ! -f _site_prod/en/about/index.html ]; then
              echo "::error::comingSoon is false but interior pages are missing — this would take the site down."
              exit 1
            fi
            echo "Full build confirmed: interior pages present."
          fi

      # Fast, and they need no credentials or network services.
      - name: Test
        run: |
          node test/visibility.test.mjs
          node test/csv.test.mjs
          python3 db/test_schema.py
          cd workers && npm test

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 57c887d9191048d984a7607c9e9334b7
        # --env production is required every time by design: the default target
        # is staging, so the dangerous one has to be named out loud.
        run: npx wrangler deploy --env production

      # Deploying is not the same as working. These are the four codes that
      # would reveal the staff area open or the site down.
      - name: Verify the live site
        run: |
          fail=0
          # RETRIED, NOT SLEPT AT.
          #
          # A Worker deploy is not visible from everywhere the instant the API
          # returns, and a flat `sleep 5` was sometimes short by a second or
          # two. On 2026-08-20 a staging deploy that had genuinely WORKED
          # reported failure — /api/admin/publish answered 404 during the
          # check and 401 a moment later, from the asset layer serving the
          # 404 page before the route existed.
          #
          # A false failure here is worse than a slow check, because the
          # Publish page decides what is live by asking which run last
          # SUCCEEDED. So a deploy that worked but was checked too early
          # leaves the console saying nothing has been previewed, and the
          # person pressing the button has no way to tell the difference.
          check() {
            url="$1"; want="$2"; got=""
            for i in $(seq 1 20); do
              got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              if [ "$got" = "$want" ]; then
                echo "ok   $url -> $got (attempt $i)"
                return
              fi
              sleep 5
            done
            echo "::error::$url returned $got, expected $want — still wrong after 100s"
            fail=1
          }
          check https://thauma.one/en/ 200
          check https://thauma.one/ 302
          check https://thauma.one/staff/ 302
          check https://thauma.one/api/staff-snapshot 401
          exit $fail
