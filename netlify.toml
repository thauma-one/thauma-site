[build]
  command = "npm run build"
  publish = "_site"

# Geo-based language detection on the root path only.
[[edge_functions]]
  path = "/"
  function = "lang-redirect"

# ---- Vanity redirects / short links -------------------------------
# Pattern for clean outbound links (thauma.one/yt -> YouTube, etc).
# Uncomment and fill as accounts exist. status 302 = temporary
# (changeable), force = true makes it win even if a page exists.
#
# [[redirects]]
#   from = "/yt"
#   to = "https://youtube.com/@thauma"
#   status = 302
#   force = true
#
# [[redirects]]
#   from = "/give-now"
#   to = "https://donorbox.org/thauma"
#   status = 302
#   force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Local dev: run Eleventy on a port that's free on this Pi
[dev]
  command = "npm run dev"
  targetPort = 8123
