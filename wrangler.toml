# Cloudflare Workers configuration — Thauma
#
# STAGING ONLY FOR NOW. This deploys to next.thauma.one so the whole stack can
# be exercised against real Cloudflare without touching anything live:
#
#   thauma.one       -> Netlify (production, unchanged)
#   dev.thauma.one   -> the Pi tunnel (unchanged)
#   next.thauma.one  -> this Worker
#
# A subdomain of thauma.one rather than a workers.dev address because
# Cloudflare Access can only gate zones you own, and testing the Access
# integration is most of the point.
#
# Account: Admin@thauma.one's Account (57c887d9…) — the Thauma-owned one.
# See docs/SPEC.md §2 for why that distinction matters.

name = "thauma"
main = "workers/src/worker.js"

# nodejs_compat is on by default from this date, but pinning it makes the
# dependency explicit rather than inherited from a default that could change.
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]


# Eleventy's build output for STAGING, built separately so this never touches
# _site (which dev.thauma.one is serving live).
#
# Built with: npx @11ty/eleventy --output=_site_next
# NOTE: Eleventy sets ELEVENTY_RUN_MODE=build itself, overriding any value you
# export — so a build here is always the comingSoon-GATED shape, exactly like
# production. That is correct for staging: /staff/* and the landing pages are
# emitted, the gated interior pages are not. When site.json flips comingSoon
# to false, the same command produces the full site.
[assets]
directory = "_site_next"
binding = "ASSETS"
# Trailing-slash directory URLs like /en/ and /staff/support/ resolve to
# index.html, matching how Netlify serves the same build today.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# WITHOUT THIS, THE STAFF AREA IS PUBLIC.
#
# Workers Static Assets serve matching files straight from the edge WITHOUT
# invoking the Worker at all — that is the whole performance point. So the
# auth check in worker.js never ran for /staff/*, because those are real
# files, and /staff/data/snapshot.json was served to anyone who asked.
# Discovered by testing, not by reading: the deploy looked fine and the
# routes all returned sensible codes.
#
# run_worker_first forces the Worker to run for these paths so it can refuse
# the request before any file is served. Everything else keeps the fast
# asset-first path.
# EVERY path the Worker needs to handle must be listed. This is an allow-list,
# not an addition: paths absent from it are served asset-first and never reach
# the router at all. Omitting "/" made the language redirect 404, and omitting
# "/api/*" made every endpoint 404 — both caught by testing immediately after.
run_worker_first = [
  "/",                          # geo language redirect
  "/api/*",                     # contact, game-scores, staff-data, snapshot
  "/.netlify/functions/*",      # legacy paths, kept alive during the cutover
  "/staff",                     # auth gate
  "/staff/*",                   # ...including the snapshot JSON
  "/admin",                     # administration — same gate
  "/admin/*",
  # The embed widgets. Unauthenticated and cross-origin by design — see
  # workers/src/embed.js. Must reach the router: served asset-first it would
  # 404, because nothing under this path exists on disk.
  "/embed/v1/*",
  # Uploaded files live in R2, not on disk. Served asset-first this would 404.
  "/media/*",
  # The mailing-list confirmation link. Public, and nothing exists on disk.
  "/confirm",
  # An invited person turning their own account on. Public for the same reason
  # as the two below: it is the page somebody visits BEFORE they can sign in,
  # so it cannot be behind the sign-in.
  "/confirm-account",
  "/confirm-email",
  # THE WAY OUT OF A MAILING LIST, and it must never be the thing that 404s.
  # A reader who cannot unsubscribe presses "report spam" instead, and that
  # damages the sending domain for everybody else the ministry writes to.
  "/unsubscribe",
  # Past newsletters, linked from the footer of every mailing.
  "/archive/*"
]

[[routes]]
pattern = "next.thauma.one/*"
zone_name = "thauma.one"

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# KV for the two documents that were in Netlify Blobs — read and written
# whole, nothing to query. See workers/src/lib/store.js.
[[kv_namespaces]]
binding = "STAFF_DATA"
id = "f79f07b51f3a493a9f2bb3714115d037"

[[kv_namespaces]]
binding = "GAME_SCORES"
id = "f23971d5b4aa460daba43e97b9d84273"

# D1 for the relational data: partners, users, contacts, interactions, goals.
#
# TWO DATABASES, DELIBERATELY. The top-level binding here is the DEV database,
# because the top-level config is what `wrangler deploy` uses for staging
# (next.thauma.one). Production is in [env.production] below and is the only
# thing that ever touches real supporter data.
#
# "Dev should always match production" and "dev should be safe to edit" cannot
# both be true — a mirror you can change is not a mirror. So they are split by
# what actually needs to match:
#
#   SCHEMA  must always match. That is what migrations are for. Apply every
#           numbered migration to BOTH, in order, and never hand-edit a
#           database. Dev is where a migration is supposed to fail first,
#           which only works if it is separate.
#
#   DATA    does not need to match. Dev runs db/seed.dev.sql, which contains
#           the edge cases ON PURPOSE (the contact overdue by 165 days).
#           When production's shape is genuinely needed, refresh explicitly
#           with db/refresh_dev.py — which SCRUBS names and emails on the way
#           in. Keeping a full copy of supporter PII in a poked-at dev
#           database would undo much of why this schema holds so little.

# ---------------------------------------------------------------------------
# MEDIA — staff photos, and anything else a person uploads
#
# NOT GIT. A phone photo committed to a repository is in every clone forever,
# and rewriting history to remove one is not a thing to ask of somebody who is
# not a full-time engineer. Object storage is where files that are DATA belong;
# the repository holds the text that references them.
#
# ⚠ THIS LIVES IN THE PERSONAL CLOUDFLARE ACCOUNT, like every other Cloudflare
# resource here. R2 buckets do not transfer between accounts, so when Thauma
# owns its own account this bucket is recreated and the objects copied across.
# That is a copy, not a migration — far cheaper than moving a database, which
# is why building here now is acceptable and building the DATABASE here was
# the thing worth arguing about.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "thauma-media"

[[d1_databases]]
binding = "DB"
database_name = "thauma-ops-dev"
database_id = "db7fcd6a-56e2-4a67-98da-3da87e95dc86"

# ---------------------------------------------------------------------------
# Public configuration
# ---------------------------------------------------------------------------
# Not secrets. The AUD tag identifies an Access application; it does not
# authorise anything on its own. Real secrets (RESEND_API_KEY,
# GAME_ADMIN_TOKEN) go in via `wrangler secret put` and never live here.
[vars]
# CLOUDFLARE ACCESS — the other door.
#
# A row in `users` has never let anybody in; Access decides who reaches the
# site at all. These let the People page keep the two lists in step, so adding
# somebody is one action in one place instead of two dashboards.
#
# NEITHER IS A SECRET. The account id is in every dashboard URL and in the
# deploy workflows already; the group name is a label somebody typed. The
# credential is ACCESS_API_TOKEN, set with `wrangler secret put`.
#
# ONE ZERO TRUST ORGANISATION SITS BEHIND ALL THREE ENVIRONMENTS — Access is
# account-wide, not per-deployment — so dev writes to the same group
# production reads. Deliberate while nothing is live; the accounts invented
# while testing have to be cleared out before launch, and removing somebody in
# the console takes them out of Access too, so that is one screen.
ACCESS_ACCOUNT_ID = "57c887d9191048d984a7607c9e9334b7"
ACCESS_GROUP_NAME = "Thauma console"
ACCESS_TEAM_DOMAIN = "thaumaone.cloudflareaccess.com"
# Comma-separated: one tag per Access application. dev.thauma.one and
# next.thauma.one are separate applications with separate tags.
ACCESS_AUD = "da1b6265b663e9152e863952d84ead73be8f8f8aa9b2ac90f50404ba707219f8,04468ad531e25f3c53af5d0b4ed0bdd3073241f76a070c741efe40f58019fdfb"
CONTACT_TO = "admin@thauma.one"
CONTACT_FROM = "Thauma <noreply@thauma.one>"

# TRANSACTIONAL SENDER — invites, confirmations, alerts. Mail somebody is
# expecting because of something that just happened.
#
# ⚠ NEWSLETTERS MUST NOT SEND FROM thauma.one. Bulk mail collects spam
# complaints; transactional mail must arrive. Every partner gets their own
# subdomain (chase-roush.thauma.one and so on) with its own Resend domain, so
# one ministry's bad month cannot delay anybody's sign-in. Subdomains carry
# largely independent reputation, but receivers also read the ORGANISATIONAL
# domain as a signal — so complaints here would bleed downward into all of
# them. Keeping thauma.one low-volume is what protects the rest.
#
# It was noreply@mail.thauma.one until 2026-08-21. The extra subdomain bought
# separation from bulk traffic that never lived there, and Resend's free tier
# allows three domains — too few to spend one on that. Transactional mail is
# low-volume and never complained about, which is exactly what keeps a domain
# clean enough to carry it.
MAIL_FROM = "Thauma <noreply@thauma.one>"

# The content editor commits to this repository. The TOKEN is a secret and goes
# in with `wrangler secret put GITHUB_TOKEN`; these two are not — they name a
# repository and a branch, and neither authorises anything on its own.
#
# CONTENT_BRANCH IS THE SITE'S BRANCH, IN EVERY ENVIRONMENT. Words are edited
# in one place and there is only one copy of them; an editor that wrote
# somewhere else would need a merge to publish, and a merge is the thing this
# design exists to remove.
#
# Saving does not deploy — the commit carries `[skip ci]`. Publish asks for the
# build. So writing to the live branch is not the same as writing to the live
# site, which is what makes this safe.
GITHUB_REPO = "thauma-one/thauma-site"
CONTENT_BRANCH = "main"

# The two branches the Publish page moves between. Same everywhere: which
# branch is live is a fact about the repository, not about the environment
# looking at it, so staging can publish and production can pull edits back.
LIVE_BRANCH = "main"
STAGING_BRANCH = "dev"

# ---------------------------------------------------------------------------
# Scheduled work — replaces Netlify's schedule() wrapper.
#
# ONE JOB: re-read the YouTube feed of every channel a partner has switched on,
# so a new video appears on their site without anybody publishing anything.
# chaseroush.com did this with a Netlify scheduled function; this is where that
# moved, and it is the last piece of that site's data Thauma was not the record
# for.
#
# WHAT IT COSTS. Ninety-six invocations a day, total, for every partner at
# once — well inside the free allowance, and the feed it reads is public, so
# there is no API key, no quota and no billing relationship behind it. Fifteen
# minutes is chosen against that: a new video shows up within the quarter hour,
# and nothing here scales with the number of videos or the number of viewers.
#
# The handler is `scheduled()` in workers/src/worker.js. It is deliberately the
# only one — see the comment there before adding a second.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/15 * * * *"]


# ---------------------------------------------------------------------------
# LOCAL DEV — what dev.thauma.one serves, through the Pi's tunnel
# ---------------------------------------------------------------------------
# Run with:  npx wrangler dev --env dev --port 8991
#
# This replaced `netlify dev` on 2026-08-15. It had to: the console now reads
# /api/staff-snapshot, which is a Worker route, and netlify dev serves the
# static build only — the four D1-backed sections 404'd against it.
#
# TWO PROCESSES, NOT ONE. netlify dev ran Eleventy itself; wrangler builds
# nothing. So thauma-dev.service runs `eleventy --watch` to keep _site current
# AND wrangler dev to serve it.
#
# ASSETS ARE _site, NOT _site_next. _site is Eleventy's watch output, and it is
# the FULL site: ELEVENTY_RUN_MODE is "watch" rather than "build", so
# src.11tydata.js does not apply the comingSoon gate. That is the long-standing
# behaviour of dev.thauma.one and most of why it is useful — the interior pages
# are visible before they are public. _site_next is the GATED staging build and
# must never be served here.
[env.dev]
name = "thauma-dev"

# LOWER THAN THE TOP-LEVEL DATE, AND IT HAS TO BE. wrangler 4.86 ships a
# workerd that supports no date later than 2026-05-03, so local dev refuses to
# start against the 2026-08-04 pinned above:
#
#   This Worker requires compatibility date "2026-08-04", but the newest date
#   supported by this server binary is "2026-05-03".
#
# Deploys are unaffected — they run on the real edge, which is current. This
# only constrains the LOCAL runtime, so dev runs a slightly older Workers
# runtime than staging and production. Nothing in this Worker depends on
# behaviour that changed between those dates, but that is a fact with a
# shelf life: re-check it when raising the top-level date.
#
# The fix is Node 22 + wrangler >= 4.123. Deferred because a system-wide Node
# upgrade on this Pi also moves Chase Roush's toolchain, and those two sites
# are meant to be independent.
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[env.dev.assets]
directory = "_site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/", "/api/*", "/.netlify/functions/*", "/staff", "/staff/*", "/admin", "/admin/*", "/embed/v1/*", "/media/*", "/confirm", "/confirm-account", "/confirm-email", "/unsubscribe", "/archive/*"]

# LOCAL SIMULATION, INCLUDING THE DATABASE. `wrangler dev` runs D1 and KV in
# miniflare against state under .wrangler/state — NOT against thauma-ops-dev.
#
# Two better-looking options were tried on 2026-08-15 and both failed:
#
#   experimental_remote = true   Rejected by wrangler 4.86 ("unexpected
#                                field"). Supported from ~4.123, which
#                                requires Node 22; the Pi runs Node 20.
#
#   wrangler dev --remote        Starts fine, real bindings — but it runs the
#                                Worker inside Cloudflare's edge under
#                                next.thauma.one's Access application. A
#                                browser that had already passed
#                                dev.thauma.one's Access got redirected to a
#                                SECOND login, for a different hostname.
#
# So: seed the local database once and it persists.
#
#   npx wrangler d1 execute thauma-ops-dev --local --env dev \
#       --file=db/migrations/0001_init.sql
#   npx wrangler d1 execute thauma-ops-dev --local --env dev \
#       --file=db/seed.dev.sql
#
# This is a THIRD database — local, remote-dev, production. It is reproducible
# from seed.dev.sql, it is safe to break, and it needs no network. The upgrade
# path that collapses it back to two is Node 22 + wrangler >= 4.123, which
# makes experimental_remote work.

# ---------------------------------------------------------------------------
# MEDIA — staff photos, and anything else a person uploads
#
# NOT GIT. A phone photo committed to a repository is in every clone forever,
# and rewriting history to remove one is not a thing to ask of somebody who is
# not a full-time engineer. Object storage is where files that are DATA belong;
# the repository holds the text that references them.
#
# ⚠ THIS LIVES IN THE PERSONAL CLOUDFLARE ACCOUNT, like every other Cloudflare
# resource here. R2 buckets do not transfer between accounts, so when Thauma
# owns its own account this bucket is recreated and the objects copied across.
# That is a copy, not a migration — far cheaper than moving a database, which
# is why building here now is acceptable and building the DATABASE here was
# the thing worth arguing about.
# ---------------------------------------------------------------------------
[[env.dev.r2_buckets]]
binding = "MEDIA"
bucket_name = "thauma-media"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "thauma-ops-dev"
database_id = "db7fcd6a-56e2-4a67-98da-3da87e95dc86"

[[env.dev.kv_namespaces]]
binding = "STAFF_DATA"
id = "f79f07b51f3a493a9f2bb3714115d037"

[[env.dev.kv_namespaces]]
binding = "GAME_SCORES"
id = "f23971d5b4aa460daba43e97b9d84273"

[env.dev.vars]
# See the note on ACCESS_ACCOUNT_ID in the top-level [vars]. Repeated because
# a named environment does not inherit vars from it.
ACCESS_ACCOUNT_ID = "57c887d9191048d984a7607c9e9334b7"
ACCESS_GROUP_NAME = "Thauma console"
ACCESS_TEAM_DOMAIN = "thaumaone.cloudflareaccess.com"
# dev.thauma.one's own Access application tag first; next's is kept so the
# same config can be pointed at either hostname without an edit.
ACCESS_AUD = "04468ad531e25f3c53af5d0b4ed0bdd3073241f76a070c741efe40f58019fdfb,da1b6265b663e9152e863952d84ead73be8f8f8aa9b2ac90f50404ba707219f8"
CONTACT_TO = "admin@thauma.one"
CONTACT_FROM = "Thauma <noreply@thauma.one>"

# TRANSACTIONAL SENDER — invites, confirmations, alerts. Mail somebody is
# expecting because of something that just happened.
#
# ⚠ NEWSLETTERS MUST NOT SEND FROM thauma.one. Bulk mail collects spam
# complaints; transactional mail must arrive. Every partner gets their own
# subdomain (chase-roush.thauma.one and so on) with its own Resend domain, so
# one ministry's bad month cannot delay anybody's sign-in. Subdomains carry
# largely independent reputation, but receivers also read the ORGANISATIONAL
# domain as a signal — so complaints here would bleed downward into all of
# them. Keeping thauma.one low-volume is what protects the rest.
#
# It was noreply@mail.thauma.one until 2026-08-21. The extra subdomain bought
# separation from bulk traffic that never lived there, and Resend's free tier
# allows three domains — too few to spend one on that. Transactional mail is
# low-volume and never complained about, which is exactly what keeps a domain
# clean enough to carry it.
MAIL_FROM = "Thauma <noreply@thauma.one>"

# The Pi edits the same branch as everywhere else. Whether it has a credential
# at all is a choice, made in `.dev.vars` (gitignored, mode 600):
#
#   NO CREDENTIAL   the editor loads and says it is not connected. Nothing on
#                   dev can touch content. Fine if you only use dev to look at
#                   the site.
#
#   CREDENTIAL      dev behaves exactly like production. Chase asked for this
#                   on 2026-08-17, and it does not create a new class of risk:
#                   Save carries [skip ci] everywhere, so editing never deploys
#                   from any host.
#
# ⚠ WHAT IT DOES MEAN: content is NOT sandboxed the way data is. The Pi has its
# own database, so invented supporters stay here — but there is one content
# branch, so a word changed on dev is THE word. And Publish on dev deploys the
# real site, not a copy.
GITHUB_REPO = "thauma-one/thauma-site"
CONTENT_BRANCH = "main"
LIVE_BRANCH = "main"
STAGING_BRANCH = "dev"


# ---------------------------------------------------------------------------
# PRODUCTION
# ---------------------------------------------------------------------------
# Deploy with:  npx wrangler deploy --env production
#
# The ONLY configuration pointing at the real database and the real hostname.
# A plain `wrangler deploy` cannot reach either, which is the point: the
# dangerous target has to be named explicitly every single time.
[env.production]
name = "thauma-production"

# ITS OWN DIRECTORY. This said `_site` until 2026-08-15, and that was a loaded
# gun: `_site` is what the dev server's `eleventy --watch` writes continuously,
# and a watch build is the UNGATED site — every interior page, because
# ELEVENTY_RUN_MODE is "watch" and src/_data/env.js treats that as a dev
# server. Deploying production from it would have published the entire
# unreleased site.
#
# Measured before the first production deploy: _site had 41 pages, a build had
# 11. Nothing in the config would have complained.
#
# Build with:  npx @11ty/eleventy --output=_site_prod
# Eleventy forces ELEVENTY_RUN_MODE=build for a plain build regardless of what
# you export, so this directory is always the comingSoon-gated shape. When
# site.json flips comingSoon to false, the same command emits the full site and
# nothing here changes.
[env.production.assets]
directory = "_site_prod"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/", "/api/*", "/.netlify/functions/*", "/staff", "/staff/*", "/admin", "/admin/*", "/embed/v1/*", "/media/*", "/confirm", "/confirm-account", "/confirm-email", "/unsubscribe", "/archive/*"]

[[env.production.routes]]
pattern = "thauma.one/*"
zone_name = "thauma.one"

# www needs its OWN route: a Workers route matches a hostname exactly, so
# "thauma.one/*" does not cover "www.thauma.one/*". Without this, www would
# keep falling through to Netlify — which works right up until the Netlify
# site is archived. The Worker 301s it to the apex; see worker.js.
[[env.production.routes]]
pattern = "www.thauma.one/*"
zone_name = "thauma.one"

[[env.production.kv_namespaces]]
binding = "STAFF_DATA"
id = "f79f07b51f3a493a9f2bb3714115d037"

[[env.production.kv_namespaces]]
binding = "GAME_SCORES"
id = "f23971d5b4aa460daba43e97b9d84273"


