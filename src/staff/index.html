<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff · Thauma</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<nav><div class="wrap nav-in">
  <a class="logo" href="/">THAUMA</a>
  <div class="nav-actions">
    <span id="whoami" style="font-size:12px;color:var(--dim);letter-spacing:.05em"></span>
    <a href="/admin/" id="admin-link" class="lang-toggle" style="display:none;text-decoration:none;line-height:1">Admin</a>
    <button class="lang-toggle" id="auth-btn">Sign In</button>
  </div>
</div></nav>

<header class="page"><div class="wrap">
  <div class="cue">Thauma Network</div>
  <h2 id="staff-heading">Staff <b>area.</b></h2>
  <p class="lede" id="login-note">This area is for the Thauma network. Sign in to continue.</p>
</div></header>

<!-- Content revealed only after login. NOTE: this stub gates content
     client-side, which is fine for low-sensitivity links and contacts.
     Before storing anything sensitive here, move the data behind a
     Netlify Function that verifies the Identity token server-side. -->
<section style="display:none" id="staff-content"><div class="wrap">
  <div class="cue foam">Quick access</div>
  <h3 class="staff-h">Network contacts</h3>
  <div class="staff-grid" id="contacts"><p class="lede">Loading…</p></div>
  <h3 class="staff-h" style="margin-top:56px">Internal resources</h3>
  <div class="staff-grid" id="resources"><p class="lede">Loading…</p></div>
  <p class="legal-note" id="role-note" style="display:none">Your account doesn't have the staff role yet — ask an admin to add it in Netlify Identity.</p>
</div></section>

<footer class="wrap">
  <div>© 2026 Thauma</div>
</footer>

<script>
  const btn = document.getElementById('auth-btn');
  const content = document.getElementById('staff-content');
  const note = document.getElementById('login-note');
  const whoami = document.getElementById('whoami');
  const adminLink = document.getElementById('admin-link');

  function render(user) {
    if (user) {
      const roles = (user.app_metadata && user.app_metadata.roles) || [];
      const name = (user.user_metadata && user.user_metadata.full_name) || user.email;
      btn.textContent = 'Sign Out';
      content.style.display = 'block';
      note.style.display = 'none';
      whoami.textContent = name + (roles.length ? ' \u00b7 ' + roles.join(', ') : '');
      adminLink.style.display = roles.includes('admin') ? 'inline-block' : 'none';
    } else {
      btn.textContent = 'Sign In';
      content.style.display = 'none';
      note.style.display = 'block';
      whoami.textContent = '';
      adminLink.style.display = 'none';
    }
  }
  async function loadStaffData(user) {
    try {
      const token = await user.jwt();
      const res = await fetch('/.netlify/functions/staff-data', {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (res.status === 401) {
        document.getElementById('role-note').style.display = 'block';
        document.getElementById('contacts').innerHTML = '';
        document.getElementById('resources').innerHTML = '';
        return;
      }
      const data = await res.json();
      const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      const contactCard = (c) => '<div class="s-card">'
        + '<h4>' + esc(c.name) + '</h4>'
        + (c.role ? '<div class="s-role">' + esc(c.role) + '</div>' : '')
        + (c.info ? '<p>' + esc(c.info) + '</p>' : '')
        + (c.link ? '<a href="' + esc(c.link) + '" class="s-link">Contact →</a>' : '')
        + '</div>';
      const resourceCard = (r) => '<div class="s-card">'
        + (r.photo ? '<div class="s-photo"><img src="' + esc(r.photo) + '" alt="" loading="lazy"></div>' : '')
        + '<h4>' + esc(r.title) + '</h4>'
        + (r.description ? '<p>' + esc(r.description) + '</p>' : '')
        + (r.link ? '<a href="' + esc(r.link) + '" class="s-link" target="_blank" rel="noopener">Open →</a>' : '')
        + '</div>';
      document.getElementById('contacts').innerHTML = data.contacts.map(contactCard).join('') || '<p class="lede">None yet.</p>';
      document.getElementById('resources').innerHTML = data.resources.map(resourceCard).join('') || '<p class="lede">None yet.</p>';
    } catch (e) {
      document.getElementById('contacts').innerHTML = '<p>Could not load.</p>';
    }
  }

  netlifyIdentity.on('init', function (user) { render(user); if (user) loadStaffData(user); });
  netlifyIdentity.on('login', function (user) { render(user); loadStaffData(user); netlifyIdentity.close(); });
  netlifyIdentity.on('logout', function () { render(null); });
  btn.addEventListener('click', function () {
    if (netlifyIdentity.currentUser()) { netlifyIdentity.logout(); }
    else { netlifyIdentity.open(); }
  });
</script>
</body>
</html>
