collections:
  - name: "translations"
    label: "Site Copy (by language)"
    files:
      - label: "English"
        name: "en"
        file: "src/_data/i18n/en.json"
        fields: *lang_fields
      - label: "Hrvatski"
        name: "hr"
        file: "src/_data/i18n/hr.json"
        fields: *lang_fields
      - label: "Srpski"
        name: "sr"
        file: "src/_data/i18n/sr.json"
        fields: *lang_fields

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "src/_data/site.json"
        fields:
          - { label: "Site name", name: "name", widget: "string" }
          - { label: "Site URL", name: "url", widget: "string" }
          - label: "Languages"
            name: "languages"
            widget: "select"
            multiple: true
            options:
              - { label: "English", value: "en" }
              - { label: "Hrvatski", value: "hr" }
              - { label: "Srpski", value: "sr" }
            hint: "Toggles which languages are actually built and shown on the public site (pages, nav, hreflang). Adding a new language beyond these three still requires a code change (a new i18n JSON file + an option added here) — this only controls on/off for the languages that already exist."
          - { label: "Default language", name: "defaultLang", widget: "string" }
          - { label: "COMING SOON mode (only the landing page is public)", name: "comingSoon", widget: "boolean" }
          - { label: "Show Events in navigation", name: "showEvents", widget: "boolean" }
          - { label: "Resources page is live", name: "resourcesReady", widget: "boolean", hint: "Off = the public site always shows the \"Resources are coming\" placeholder, no matter what's in the Resources collection below. Flip this on when ready to launch it. The dev server always shows real Resource entries regardless of this flag, so you can preview and build the page before going live." }
          - label: "Photos"
            name: "images"
            widget: "object"
            fields:
              - { label: "Home — who-we-are frame", name: "home_who", widget: "framed-photo", required: false, hint: "Drag the photo to reposition it, use the slider to zoom. Wide/horizontal photos work best; the cinematic dark treatment is applied automatically on the live site." }
              - { label: "About — our posture frame", name: "about_posture", widget: "framed-photo", required: false, hint: "Shown at the bottom of the \"students of the culture\" section. Leave blank to hide — the section reads fine without it." }
              - { label: "Mission — the horizon frame", name: "mission_horizon", widget: "framed-photo", required: false, hint: "Shown at the bottom of the \"we measure in years\" section. Leave blank to hide." }
              - { label: "Give — impact frame", name: "give_impact", widget: "framed-photo", required: false, hint: "Shown between the giving options and the donation form. Leave blank to hide." }
          - label: "Social links (icons appear in the footer only when filled)"
            name: "socials"
            widget: "object"
            fields:
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "X URL", name: "x", widget: "string", required: false }
          - label: "Donorbox embed URLs"
            name: "donorbox"
            widget: "object"
            fields:
              - { label: "English form URL", name: "en", widget: "string", required: false }
              - { label: "Croatian form URL", name: "hr", widget: "string", required: false }

  - name: "team"
    label: "Team Members"
    label_singular: "Team Member"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Display order", name: "order", widget: "number", default: 10 }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Bio page photo", name: "bio_photo", widget: "image", required: false, hint: "Optional — shown only on this person's bio page. Leave blank to reuse the Photo above. Any aspect ratio is fine; the frame adapts to the image, not the other way around." }
      - { label: "Home base", name: "base", widget: "string", hint: "e.g. Zagreb, Croatia" }
      - { label: "Email", name: "email", widget: "string", required: false }
      - label: "Role / Position"
        name: "role"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Croatian", name: "hr", widget: "string" }
      - label: "Bio"
        name: "bio"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "markdown" }
          - { label: "Croatian", name: "hr", widget: "markdown" }

  - name: "resources"
    label: "Resources"
    label_singular: "Resource"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - label: "Title"
        name: "title"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "string" }
          - { label: "Croatian", name: "hr", widget: "string" }
      - { label: "Display order", name: "order", widget: "number", default: 10 }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - label: "Description"
        name: "description"
        widget: "object"
        fields:
          - { label: "English", name: "en", widget: "markdown" }
          - { label: "Croatian", name: "hr", widget: "markdown" }
      - { label: "Link", name: "link", widget: "string", required: false, hint: "Optional — e.g. a PDF, a video, or an external page. Leave blank if the description is enough on its own." }
