# ============ THAUMA ADMIN (Decap CMS) ============
# Point-and-click editing for all site copy.
# Requires: Netlify Identity + Git Gateway enabled in the
# Netlify dashboard (see README, "Admin setup").

backend:
  name: git-gateway
  branch: main

# Local-only testing: run `npm run cms-proxy` alongside `npm run dev`, then
# visit /admin/ from this machine (or over SSH/LAN) — Decap detects the proxy
# and skips Netlify Identity entirely, committing straight to whatever branch
# is checked out locally. Has no effect in production (no proxy = ignored),
# and isn't reachable through the public tunnel (browser looks for the proxy
# on ITS OWN localhost, not this Pi's) — so it doesn't open remote access.
local_backend: true

site_url: https://thauma.one
display_url: https://thauma.one

# Remove the raw preview pane - full-width editor, far less clutter
editor:
  preview: false

media_folder: "src/img"
public_folder: "/img"

# Shared field schema for a language file (YAML anchor, reused below)
x_lang_fields: &lang_fields
